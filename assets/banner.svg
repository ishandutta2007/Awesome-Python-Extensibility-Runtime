<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pill-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    /* Dynamic Background Elements */
    @keyframes pulse-orbit {
      0% { transform: rotate(0deg) scale(1); opacity: 0.35; }
      50% { transform: rotate(180deg) scale(1.1); opacity: 0.7; }
      100% { transform: rotate(360deg) scale(1); opacity: 0.35; }
    }
    @keyframes float-node {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-10px) scale(1.05); }
    }
    @keyframes float-reverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes beam-pulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }

    .orbiting-ring {
      transform-origin: 960px 180px;
      animation: pulse-orbit 24s linear infinite;
    }
    .floating-card-1 {
      animation: float-node 6s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: float-reverse 7s ease-in-out infinite;
    }
    .floating-card-3 {
      animation: float-node 8s ease-in-out infinite;
    }
    .flowing-path {
      stroke-dasharray: 8, 8;
      animation: dash-flow 2s linear infinite;
    }
    .pulse-glow {
      animation: beam-pulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="12" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="12" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="980" cy="200" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="320" r="120" fill="#c084fc" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Background Network Rings -->
  <g class="orbiting-ring">
    <ellipse cx="960" cy="180" rx="150" ry="85" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" stroke-dasharray="6 6" />
    <ellipse cx="960" cy="180" rx="110" ry="140" fill="none" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1.5" />
    <circle cx="830" cy="140" r="4" fill="#38bdf8" />
    <circle cx="1070" cy="220" r="5" fill="#c084fc" />
  </g>

  <!-- Flowing Network Connectors (behind text) -->
  <g opacity="0.4">
    <path class="flowing-path" d="M 50 300 Q 300 240 550 290 T 1050 280" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="flowing-path" d="M 80 80 Q 400 130 750 60 T 1150 110" fill="none" stroke="#818cf8" stroke-width="1.5" style="animation-duration: 3s;" />
  </g>

  <!-- Foreground Title & Subtitle (High contrast, firmly in foreground) -->
  <g id="foreground-content">
    <!-- Category Tag / Badge -->
    <g transform="translate(60, 52)">
      <rect width="210" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" class="pulse-glow" />
      <text x="28" y="19" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">PYTHON RUNTIME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="135" fill="url(#text-grad)" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Python Extensibility
    </text>
    <text x="60" y="185" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5">
      &amp; Serverless Runtimes 🚀
    </text>

    <!-- Subtitle -->
    <text x="60" y="225" fill="#94a3b8" font-size="16" font-weight="400">
      Curated Index of Distributed Compute, Sandboxed Execution, Serverless GPU &amp; Database UDFs
    </text>

    <!-- Feature Pills / Dynamic Tags (Foreground) -->
    <g transform="translate(60, 260)" class="floating-card-1">
      <rect width="130" height="34" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="16" y="22" fill="#e2e8f0" font-size="13" font-weight="600">⚡ Serverless GPU</text>
    </g>

    <g transform="translate(202, 260)" class="floating-card-2">
      <rect width="145" height="34" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
      <text x="16" y="22" fill="#e2e8f0" font-size="13" font-weight="600">🛡️ Agent Sandboxes</text>
    </g>

    <g transform="translate(359, 260)" class="floating-card-3">
      <rect width="135" height="34" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1" />
      <text x="16" y="22" fill="#e2e8f0" font-size="13" font-weight="600">📊 Database UDFs</text>
    </g>

    <g transform="translate(506, 260)" class="floating-card-1">
      <rect width="155" height="34" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1" />
      <text x="16" y="22" fill="#e2e8f0" font-size="13" font-weight="600">🌐 Distributed Clusters</text>
    </g>
  </g>

  <!-- Interactive/Dynamic Metric Card on Right Side -->
  <g transform="translate(850, 75)" class="floating-card-2">
    <rect width="280" height="200" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" backdrop-filter="blur(8px)" />
    
    <text x="24" y="38" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1">SYSTEM ARCHITECTURE</text>
    
    <!-- Code Snippet representation -->
    <rect x="20" y="52" width="240" height="30" rx="6" fill="rgba(0,0,0,0.4)" />
    <text x="32" y="72" fill="#38bdf8" font-family="monospace" font-size="12">@runtime.function(gpu="H100")</text>
    
    <rect x="20" y="90" width="240" height="30" rx="6" fill="rgba(0,0,0,0.4)" />
    <text x="32" y="110" fill="#a78bfa" font-family="monospace" font-size="12">def run_ai_sandbox(ctx):</text>

    <rect x="20" y="128" width="240" height="48" rx="6" fill="rgba(34, 197, 94, 0.1)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1" />
    <text x="32" y="148" fill="#4ade80" font-size="12" font-weight="600">✓ MicroVM Isolated (gVisor)</text>
    <text x="32" y="165" fill="#94a3b8" font-size="11">Scale-to-zero • Sub-second start</text>
  </g>
</svg>
